# Reusable workflow: Push consolidated App Information page fields
# (accessibility URL, subscription status URLs, content rights, EULA)
# from a single metadata/AppInfo/app_info.jsonc file.
#
# Each section is optional — the lane only touches sections present
# in the file. Idempotent: only PATCHes when state diverges.
#
# Out of scope (separate lanes / not yet implemented):
#   - Accessibility declarations (per-deviceFamily matrix)
#   - Age rating questionnaire
#   - Per-locale fields (privacy_url, name, subtitle) — handled by metadata pipeline
#
# Credential resolution: see .github/actions/resolve-asc-credentials.
#   Class 1 (legacy): caller passes APP_STORE_CONNECT_* repo secrets.
#   Class 2 (vault):  caller defines a single GitHub Environment named
#                     after the team_slug; org-level VAULT_REPO_PAT secret
#                     gives read access to asc-api-vault.
#
# Required repo variables:
#   IOS_RELEASE_APP_BUNDLE_ID

name: iOS App Info (Reusable)

on:
  workflow_call:
    inputs:
      input_path:
        description: "Path (relative to caller repo root) to app_info.jsonc"
        required: false
        type: string
        default: "metadata/AppInfo/app_info.jsonc"
      team_slug:
        description: "Override Environment auto-detect (Class 2). Leave empty for the common case."
        required: false
        type: string
        default: ""
      ruby_version:
        description: "Ruby version for fastlane"
        required: false
        type: string
        default: "3.2"
      macos_runner:
        description: "macOS runner label"
        required: false
        type: string
        default: "macos-26"

concurrency:
  group: ios-app-info-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-app-info:
    name: Update App Information fields
    runs-on: ${{ inputs.macos_runner }}
    timeout-minutes: 15

    steps:
      - name: Checkout app/metadata repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CHECKOUT_PAT || github.token }}

      - name: Checkout ios-ci tooling
        uses: actions/checkout@v4
        with:
          repository: NovusOrdoApps/ios-ci
          path: _ci

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true
          working-directory: _ci

      - name: Resolve ASC credentials (Class 1 secrets ↔ Class 2 vault)
        uses: ./_ci/.github/actions/resolve-asc-credentials
        with:
          gh_token:           ${{ secrets.CHECKOUT_PAT || github.token }}
          team_slug:          ${{ inputs.team_slug }}
          vault_pat:          ${{ secrets.VAULT_REPO_PAT }}
          fallback_p8:        ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          fallback_key_id:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          fallback_issuer_id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}


      - name: Resolve app bundle ID (asc-app.jsonc → fallback to repo var)
        uses: ./_ci/.github/actions/resolve-app-bundle-id
        with:
          fallback: ${{ vars.IOS_RELEASE_APP_BUNDLE_ID }}
      - name: Validate inputs
        run: |
          : "${APP_BUNDLE_ID:?Missing GitHub Actions variable IOS_RELEASE_APP_BUNDLE_ID}"

          if [ ! -f "${{ inputs.input_path }}" ]; then
            echo ":: ${{ inputs.input_path }} not found — nothing to do (no app info configured)"
            echo "SKIP_RUN=1" >> "$GITHUB_ENV"
          fi

          echo ":: App Bundle ID: $APP_BUNDLE_ID"
          echo ":: Input path: ${{ inputs.input_path }}"

      - name: Push App Info to App Store Connect
        if: env.SKIP_RUN != '1'
        working-directory: _ci
        run: |
          bundle exec fastlane update_app_info \
            input_path:"$GITHUB_WORKSPACE/${{ inputs.input_path }}"

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-secrets/AuthKey.p8"
