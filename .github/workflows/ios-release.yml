# Reusable workflow: Build and release an iOS app.
#
# Auto-detects:
#   - Flutter vs native Xcode project
#   - Workspace/project file location
#   - Scheme, targets, bundle IDs, team ID
#   - Generates ExportOptions.plist dynamically
#
# Required repo secrets (per-app):
#   APP_STORE_CONNECT_API_KEY_P8
#   APP_STORE_CONNECT_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID
#
# Required org secrets (shared):
#   CHECKOUT_PAT, MATCH_PASSWORD, MATCH_GIT_URL, MATCH_GIT_PAT
#   DIAWI_TOKEN, TG_WORKER_API_KEY  (only needed if adhoc=true)

name: iOS Release (Reusable)

on:
  workflow_call:
    inputs:
      team_slug:
        description: "Override Environment auto-detect (Class 2). Leave empty for the common case."
        required: false
        type: string
        default: ""
      adhoc:
        description: "Also build ad-hoc IPA and upload to Diawi"
        required: false
        type: boolean
        default: false
      macos_runner:
        description: "macOS runner label"
        required: false
        type: string
        default: "macos-26"
      ruby_version:
        description: "Ruby version for fastlane"
        required: false
        type: string
        default: "3.2"
      scheme:
        description: "Explicit Xcode scheme to build when the repo has multiple app schemes"
        required: false
        type: string
        default: ""
      configuration:
        description: "Xcode configuration used for validation, detection, and native builds"
        required: false
        type: string
        default: "Release"
      release_identity_mode:
        description: "How ios-ci applies release team and bundle IDs: 'managed' patches the project in CI, 'xcconfig' expects the app repo to provide them"
        required: false
        type: string
        default: "managed"
      detect_all_targets:
        description: >-
          Also enumerate signable targets that the scheme's build action does not list — an
          app that embeds extensions pulls them in as implicit dependencies, so their bundle
          IDs are invisible to the default scheme-only query. Leave false unless the repo has
          extension targets: this list drives match, set_signing and ExportOptions, so an
          unexpected entry means a profile request for an App ID that may not exist.
        required: false
        type: boolean
        default: false
      automatic_signing:
        description: >-
          Sign with Xcode automatic signing instead of match profiles. Leave false unless the
          app needs App IDs that match cannot provision on its own — App Groups and Network
          Extensions, i.e. an app embedding a tunnel or widget extension. When true, match
          still supplies the distribution certificate but xcodebuild registers the App IDs,
          enables their capabilities from each target's entitlements, and issues the profiles.
        required: false
        type: boolean
        default: false
      socks5_url:
        description: >-
          Per-entity residential SOCKS5 egress (socks5://user:pass@host:port). Blank = direct.
          Routes the job's Apple traffic through the proxy via asc-ops-workflow's contained
          TUN — pass it when Apple's developer-services endpoints reject the runner's
          datacenter IP (the session workflows already require this; xcodebuild's
          -allowProvisioningUpdates path talks to the same infrastructure).
        required: false
        type: string
        default: ""
      app_version:
        description: "Marketing version to release (e.g. '1.2.3'). Must be in semver format."
        required: true
        type: string
      build_number:
        description: "Optional build number override. Defaults to GITHUB_RUN_NUMBER. Must be a positive integer."
        required: false
        type: string
        default: ""

concurrency:
  group: ios-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build & Release iOS
    runs-on: ${{ inputs.macos_runner }}
    timeout-minutes: 90

    permissions:
      contents: write

    env:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BRANCH: ${{ vars.MATCH_GIT_BRANCH }}
      # APP_STORE_CONNECT_KEY_ID / ISSUER_ID + IOS_RELEASE_TEAM_ID are
      # exported by the Resolve ASC credentials step below (Class 1 from
      # repo secrets/vars; Class 2 from vault).
      IOS_RELEASE_APP_BUNDLE_ID: ${{ vars.IOS_RELEASE_APP_BUNDLE_ID }}
      IOS_RELEASE_EXTENSION_BUNDLE_ID: ${{ vars.IOS_RELEASE_EXTENSION_BUNDLE_ID }}
      IOS_RELEASE_TARGET_BUNDLE_IDS_JSON: ${{ vars.IOS_RELEASE_TARGET_BUNDLE_IDS_JSON }}

    steps:
      # ── Checkout ───────────────────────────────

      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CHECKOUT_PAT }}

      - name: Checkout ios-ci tooling
        uses: actions/checkout@v4
        with:
          repository: NovusOrdoApps/ios-ci
          path: _ci
          token: ${{ secrets.CHECKOUT_PAT }}

      # ── Setup tools ────────────────────────────

      - name: Check if Flutter project
        id: flutter_check
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "is_flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_flutter=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Flutter
        if: steps.flutter_check.outputs.is_flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true
          working-directory: _ci

      # Optional residential egress for Apple traffic. Contained-route: ONLY the pinned Apple
      # hosts (incl. developerservices2.apple.com, which xcodebuild's provisioning path uses)
      # plus 17/8 go through the TUN; GitHub, gems, go.dev etc. stay direct. No-op when the
      # input is blank. Tears itself down at job end via the action's post: hook.
      - name: Bring up SOCKS5 egress for Apple traffic
        if: inputs.socks5_url != ''
        uses: NovusOrdoApps/asc-ops-workflow/.github/actions/socks5-egress@main
        with:
          socks5_url: ${{ inputs.socks5_url }}

      - name: Resolve ASC credentials (Class 1 secrets ↔ Class 2 vault)
        uses: ./_ci/.github/actions/resolve-asc-credentials
        with:
          gh_token:           ${{ secrets.CHECKOUT_PAT || github.token }}
          team_slug:          ${{ inputs.team_slug }}
          vault_pat:          ${{ secrets.VAULT_REPO_PAT }}
          fallback_p8:        ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          fallback_key_id:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          fallback_issuer_id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          fallback_team_id:   ${{ vars.IOS_RELEASE_TEAM_ID }}


      - name: Resolve app bundle ID (asc-app.jsonc → fallback to repo var)
        uses: ./_ci/.github/actions/resolve-app-bundle-id
        with:
          fallback: ${{ vars.IOS_RELEASE_APP_BUNDLE_ID }}
      - name: Encode match git credentials
        run: |
          ENCODED=$(printf "pat:%s" "${{ secrets.MATCH_GIT_PAT }}" | base64 | tr -d '\n')
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$ENCODED" >> "$GITHUB_ENV"

      - name: Create CI keychain
        working-directory: _ci
        run: bundle exec fastlane setup_keychain

      - name: Validate release identity mode
        run: |
          case "${{ inputs.release_identity_mode }}" in
            managed|xcconfig)
              ;;
            *)
              echo "ERROR: Unsupported release_identity_mode='${{ inputs.release_identity_mode }}'. Use 'managed' or 'xcconfig'." >&2
              exit 1
              ;;
          esac

      - name: Resolve release version metadata
        id: version_meta
        env:
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          if ! printf '%s' "$INPUT_APP_VERSION" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: app_version must look like v1.2.3 or 1.2.3. Got '$INPUT_APP_VERSION'." >&2
            exit 1
          fi
          VERSION="${INPUT_APP_VERSION#v}"
          echo "marketing_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo ":: app_version='$INPUT_APP_VERSION' -> MARKETING_VERSION=$VERSION"

          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            if ! printf '%s' "$INPUT_BUILD_NUMBER" | grep -Eq '^[1-9][0-9]*$'; then
              echo "ERROR: build_number must be a positive integer. Got '$INPUT_BUILD_NUMBER'." >&2
              exit 1
            fi
            BUILD_NUMBER="$INPUT_BUILD_NUMBER"
            echo ":: CURRENT_PROJECT_VERSION=${BUILD_NUMBER} (explicit override)"
          else
            BUILD_NUMBER="$GITHUB_RUN_NUMBER"
            echo ":: CURRENT_PROJECT_VERSION=${BUILD_NUMBER} (GITHUB_RUN_NUMBER)"
          fi
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      # ── Run app-specific prepare script (if exists) ──
      # Must run BEFORE detect — some projects generate xcconfigs
      # that xcodebuild needs to resolve bundle IDs and team ID.

      - name: Run prepare script
        run: |
          if [ -f "./scripts/prepare.sh" ]; then
            echo ":: Found scripts/prepare.sh, running..."
            chmod +x ./scripts/prepare.sh
            ./scripts/prepare.sh
          else
            echo ":: No scripts/prepare.sh found, skipping."
          fi

      - name: Locate Xcode project
        id: locate
        run: bash _ci/scripts/detect-project.sh . "" "${{ inputs.configuration }}" locate-only

      - name: Install CocoaPods dependencies
        run: |
          IOS_DIR="${{ steps.locate.outputs.ios_dir }}"
          if [ -f "$IOS_DIR/Podfile" ]; then
            echo ":: Found Podfile, running pod install before validation..."
            cd "$IOS_DIR"
            pod install
          else
            echo ":: No Podfile found, skipping."
          fi

      # ── Discover scheme / targets before optional CI-managed patching ──

      - name: Pre-detect Xcode project
        id: detect_pre
        env:
          DETECT_ALL_TARGETS: ${{ inputs.detect_all_targets }}
        run: bash _ci/scripts/detect-project.sh . "${{ inputs.scheme }}" "${{ inputs.configuration }}" prepatch

      - name: Stamp build version
        working-directory: _ci
        env:
          IOS_RELEASE_MARKETING_VERSION: ${{ steps.version_meta.outputs.marketing_version }}
          IOS_RELEASE_BUILD_NUMBER: ${{ steps.version_meta.outputs.build_number }}
        run: |
          bundle exec ruby scripts/stamp-build-version.rb \
            "$GITHUB_WORKSPACE" \
            "${{ steps.detect_pre.outputs.project }}" \
            "${{ steps.detect_pre.outputs.configuration }}" \
            '${{ steps.detect_pre.outputs.targets_json }}'

      - name: Apply CI-managed release identity
        if: inputs.release_identity_mode == 'managed'
        working-directory: _ci
        env:
          # resolve-app-bundle-id already set APP_BUNDLE_ID from asc-app.jsonc
          # (Class 2 / vault) or the IOS_RELEASE_APP_BUNDLE_ID var (Class 1).
          # manage-release-identity.rb reads IOS_RELEASE_APP_BUNDLE_ID, so feed
          # it the resolved value — otherwise vault-based repos (empty var) fail.
          IOS_RELEASE_APP_BUNDLE_ID: ${{ env.APP_BUNDLE_ID }}
        run: |
          : "${IOS_RELEASE_TEAM_ID:?Missing IOS_RELEASE_TEAM_ID — set the var or ensure vault team_id.txt exists}"
          : "${IOS_RELEASE_APP_BUNDLE_ID:?Missing bundle id — set asc-app.jsonc bundle_id or the IOS_RELEASE_APP_BUNDLE_ID var}"
          bundle exec ruby scripts/manage-release-identity.rb \
            "$GITHUB_WORKSPACE" \
            "${{ steps.detect_pre.outputs.project }}" \
            "${{ steps.detect_pre.outputs.configuration }}" \
            '${{ steps.detect_pre.outputs.targets_json }}'

      # ── Detect final project structure ─────────

      - name: Detect patched Xcode project
        id: detect
        env:
          DETECT_ALL_TARGETS: ${{ inputs.detect_all_targets }}
        run: bash _ci/scripts/detect-project.sh . "${{ inputs.scheme }}" "${{ inputs.configuration }}"

      - name: Print detection results
        run: |
          echo "Flutter:    ${{ steps.detect.outputs.is_flutter }}"
          echo "Workspace:  ${{ steps.detect.outputs.workspace }}"
          echo "Project:    ${{ steps.detect.outputs.project }}"
          echo "iOS dir:    ${{ steps.detect.outputs.ios_dir }}"
          echo "Scheme:     ${{ steps.detect.outputs.scheme }}"
          echo "Config:     ${{ steps.detect.outputs.configuration }}"
          echo "Team ID:    ${{ steps.detect.outputs.team_id }}"
          echo "Bundle IDs: ${{ steps.detect.outputs.app_identifiers }}"
          echo "Targets:    ${{ steps.detect.outputs.targets_json }}"

      - name: Validate xcconfig release contract
        if: inputs.release_identity_mode == 'xcconfig'
        working-directory: _ci
        run: |
          bundle exec ruby scripts/validate-project-contract.rb \
            "$GITHUB_WORKSPACE" \
            "${{ steps.detect.outputs.project }}" \
            "${{ steps.detect.outputs.configuration }}" \
            '${{ steps.detect.outputs.targets_json }}'

      - name: Validate CI-managed release identity
        if: inputs.release_identity_mode == 'managed'
        env:
          DETECTED_TARGETS_JSON: ${{ steps.detect.outputs.targets_json }}
          # Use the resolved bundle id (asc-app.jsonc / vault), not the raw var
          # which is empty for Class-2 (vault) repos.
          IOS_RELEASE_APP_BUNDLE_ID: ${{ env.APP_BUNDLE_ID }}
        run: |
          if [ "${{ steps.detect.outputs.team_id }}" != "$IOS_RELEASE_TEAM_ID" ]; then
            echo "ERROR: ios-ci patched DEVELOPMENT_TEAM to '$IOS_RELEASE_TEAM_ID', but xcodebuild resolved '${{ steps.detect.outputs.team_id }}'." >&2
            exit 1
          fi

          echo "$DETECTED_TARGETS_JSON" | jq -e --arg bundle_id "$IOS_RELEASE_APP_BUNDLE_ID" '
            any(.[]; .product_type == "com.apple.product-type.application" and .bundle_id == $bundle_id)
          ' >/dev/null || {
            echo "ERROR: ios-ci patched release identity, but no application target resolved PRODUCT_BUNDLE_IDENTIFIER=$IOS_RELEASE_APP_BUNDLE_ID." >&2
            exit 1
          }

      - name: Validate Flutter build inputs
        if: steps.detect.outputs.is_flutter == 'true'
        run: |
          if [ "${{ steps.detect.outputs.configuration }}" != "Release" ]; then
            echo "ERROR: Flutter builds currently support only configuration=Release in ios-ci. Keep configuration at Release and use scheme/flavor overrides if needed." >&2
            exit 1
          fi

      # ── Generate ExportOptions ─────────────────

      # Assembled once and reused by every signing/build step below, so the archive and the
      # export cannot disagree about which mode they are in.
      - name: Resolve signing mode
        id: signing
        env:
          TARGETS_JSON: ${{ steps.detect.outputs.targets_json }}
          ALL_APP_IDS: ${{ steps.detect.outputs.app_identifiers }}
        run: |
          if [ "${{ inputs.automatic_signing }}" = "true" ]; then
            echo "style=automatic" >> "$GITHUB_OUTPUT"
            echo "skip_profiles=true" >> "$GITHUB_OUTPUT"

            # xcodebuild wants the key file to carry its key ID: AuthKey_<KEYID>.p8. Handed
            # a differently-named file it reports "Authentication failed: Make sure a bearer
            # token was provided, it is properly configured and signed, and it has not
            # expired" — which reads like a bad key and is not one. The same file
            # authenticates fine through Spaceship moments earlier in install_profiles,
            # because the App Store Connect API takes the key ID as a parameter while
            # xcodebuild's Developer-portal path leans on the filename convention.
            #
            # Copy rather than rename: ASC_KEY_P8_PATH is what every other lane and the
            # cleanup step reference, and this branch must not disturb them.
            NAMED_KEY="$(dirname "$ASC_KEY_P8_PATH")/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
            cp "$ASC_KEY_P8_PATH" "$NAMED_KEY"
            # Guarantee a trailing newline. Vault keys minted through the iris API are the
            # raw Base64-decoded bytes and end on the PEM footer with no \n; keys downloaded
            # from Apple's UI end with one. Ruby's OpenSSL accepts both — which is why
            # Spaceship authenticates with this same file — but stricter PEM parsers do not,
            # and xcodebuild's "Authentication failed: Make sure a bearer token was
            # provided" names the token, not the file, when the key never parsed.
            [ -n "$(tail -c1 "$NAMED_KEY")" ] && printf '\n' >> "$NAMED_KEY"
            chmod 600 "$NAMED_KEY"

            # Also stage at the canonical location Apple's tools search on their own
            # (~/.appstoreconnect/private_keys). -authenticationKeyPath should make this
            # redundant; documented reality is that parts of the provisioning stack consult
            # the search path regardless. Cheap, and removed in cleanup.
            mkdir -p "$HOME/.appstoreconnect/private_keys"
            cp "$NAMED_KEY" "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

            echo "xcargs=-allowProvisioningUpdates -authenticationKeyPath $NAMED_KEY -authenticationKeyID $APP_STORE_CONNECT_KEY_ID -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID" >> "$GITHUB_OUTPUT"

            # Hand match ONLY the application target's bundle ID.
            #
            # skip_provisioning_profiles stops match creating profiles, but it does NOT stop
            # match validating every app_identifier it was given: runner.rb verifies each one
            # exists on the portal BEFORE it fetches the certificate, outside that guard. Under
            # automatic signing the extensions' App IDs are exactly what does not exist yet —
            # xcodebuild registers them during the archive — so passing them here aborts the
            # run before the certificate it is actually being called for is ever installed.
            # The app's own App ID always exists by this point; the certificate is per-team
            # anyway, so the list has no bearing on which cert comes back.
            CERT_IDS=$(printf '%s' "$TARGETS_JSON" | jq -r '[.[] | select(.product_type == "com.apple.product-type.application") | .bundle_id] | join(",")')
            if [ -z "$CERT_IDS" ]; then
              CERT_IDS="$ALL_APP_IDS"
            fi
            echo "match_app_identifiers=$CERT_IDS" >> "$GITHUB_OUTPUT"

            echo ":: Signing: automatic (xcodebuild provisions App IDs and capabilities)"
            echo ":: match receives certificate-only scope: $CERT_IDS"
          else
            echo "style=manual" >> "$GITHUB_OUTPUT"
            echo "skip_profiles=false" >> "$GITHUB_OUTPUT"
            echo "xcargs=" >> "$GITHUB_OUTPUT"
            echo "match_app_identifiers=$ALL_APP_IDS" >> "$GITHUB_OUTPUT"
            echo ":: Signing: manual (match profiles)"
          fi

      - name: Generate ExportOptions plists
        run: |
          mkdir -p build/export-options
          bash _ci/scripts/generate-export-options.sh \
            "app-store" \
            "${{ steps.detect.outputs.team_id }}" \
            '${{ steps.detect.outputs.targets_json }}' \
            "build/export-options/AppStore.plist" \
            "${{ steps.signing.outputs.style }}"

          bash _ci/scripts/generate-export-options.sh \
            "ad-hoc" \
            "${{ steps.detect.outputs.team_id }}" \
            '${{ steps.detect.outputs.targets_json }}' \
            "build/export-options/AdHoc.plist" \
            "${{ steps.signing.outputs.style }}"

      # ══════════════════════════════════════════════
      # BUILD: App Store IPA
      # ══════════════════════════════════════════════

      - name: Install app-store signing profiles
        working-directory: _ci
        run: |
          bundle exec fastlane install_profiles \
            type:appstore \
            app_identifiers:"${{ steps.signing.outputs.match_app_identifiers }}" \
            skip_provisioning_profiles:"${{ steps.signing.outputs.skip_profiles }}"

      - name: Set app-store code signing
        working-directory: _ci
        run: |
          bundle exec fastlane set_signing \
            type:appstore \
            targets_json:'${{ steps.detect.outputs.targets_json }}' \
            team_id:"${{ steps.detect.outputs.team_id }}" \
            automatic:"${{ inputs.automatic_signing }}" \
            xcodeproj:"$GITHUB_WORKSPACE/${{ steps.detect.outputs.project }}"

      - name: Build app-store IPA
        run: |
          if [ "${{ steps.detect.outputs.is_flutter }}" = "true" ]; then
            FLUTTER_ARGS=(build ipa --release --export-options-plist build/export-options/AppStore.plist --build-number "${{ steps.version_meta.outputs.build_number }}")
            if [ -n "${{ steps.version_meta.outputs.marketing_version }}" ]; then
              FLUTTER_ARGS+=(--build-name "${{ steps.version_meta.outputs.marketing_version }}")
            fi
            if [ "${{ steps.detect.outputs.scheme }}" != "Runner" ]; then
              FLUTTER_ARGS+=(--flavor "${{ steps.detect.outputs.scheme }}")
            fi
            flutter "${FLUTTER_ARGS[@]}"
          else
            cd _ci
            bundle exec fastlane build_native \
              workspace:"$GITHUB_WORKSPACE/${{ steps.detect.outputs.workspace }}" \
              project:"$GITHUB_WORKSPACE/${{ steps.detect.outputs.project }}" \
              scheme:"${{ steps.detect.outputs.scheme }}" \
              configuration:"${{ steps.detect.outputs.configuration }}" \
              export_options:"$GITHUB_WORKSPACE/build/export-options/AppStore.plist" \
              xcargs:"${{ steps.signing.outputs.xcargs }}"
          fi

      - name: Collect app-store IPA
        run: |
          mkdir -p build/artifacts
          if [ "${{ steps.detect.outputs.is_flutter }}" = "true" ]; then
            cp build/ios/ipa/*.ipa build/artifacts/AppStore.ipa
          else
            cp _ci/build/artifacts/App.ipa build/artifacts/AppStore.ipa
          fi

      # ── Upload dSYMs to Crashlytics (if available) ──

      - name: Upload dSYMs to Crashlytics
        continue-on-error: true
        run: |
          # Find the upload-symbols binary (could be in Pods of the app repo)
          IOS_DIR="${{ steps.detect.outputs.ios_dir }}"
          UPLOAD_SYMBOLS=$(find "$IOS_DIR" -path "*/FirebaseCrashlytics/upload-symbols" 2>/dev/null | head -1)
          GSP_PATH=$(find "$IOS_DIR" -name "GoogleService-Info.plist" -not -path "*/Pods/*" 2>/dev/null | head -1)

          if [ "${{ steps.detect.outputs.is_flutter }}" = "true" ]; then
            DSYM_PATH="build/ios/archive/Runner.xcarchive/dSYMs"
          else
            DSYM_ZIP=$(find _ci/build/artifacts -name "*.dSYM.zip" 2>/dev/null | head -1)
            if [ -n "$DSYM_ZIP" ]; then
              DSYM_TMP="$RUNNER_TEMP/native-dsyms"
              rm -rf "$DSYM_TMP"
              mkdir -p "$DSYM_TMP"
              unzip -q "$DSYM_ZIP" -d "$DSYM_TMP"
              DSYM_PATH="$DSYM_TMP"
            else
              DSYM_PATH=$(find _ci/build -name "*.dSYM" -type d 2>/dev/null | head -1)
              DSYM_PATH="${DSYM_PATH%/*}"  # parent directory
            fi
          fi

          if [ -n "$UPLOAD_SYMBOLS" ] && [ -n "$GSP_PATH" ] && [ -d "$DSYM_PATH" ]; then
            "$UPLOAD_SYMBOLS" -gsp "$GSP_PATH" -p ios "$DSYM_PATH"
            echo ":: dSYMs uploaded."
          else
            echo ":: Skipping Crashlytics dSYM upload (not configured)."
          fi

      # ── Upload to TestFlight ───────────────────

      - name: Upload to TestFlight
        working-directory: _ci
        env:
          IPA_PATH: ${{ github.workspace }}/build/artifacts/AppStore.ipa
        run: bundle exec fastlane upload_testflight_ipa

      # ══════════════════════════════════════════════
      # BUILD: Ad-Hoc IPA (conditional)
      # ══════════════════════════════════════════════

      - name: Install ad-hoc signing profiles
        if: inputs.adhoc
        working-directory: _ci
        run: |
          bundle exec fastlane install_profiles \
            type:adhoc \
            app_identifiers:"${{ steps.signing.outputs.match_app_identifiers }}" \
            skip_provisioning_profiles:"${{ steps.signing.outputs.skip_profiles }}"

      - name: Set ad-hoc code signing
        if: inputs.adhoc
        working-directory: _ci
        run: |
          bundle exec fastlane set_signing \
            type:adhoc \
            targets_json:'${{ steps.detect.outputs.targets_json }}' \
            team_id:"${{ steps.detect.outputs.team_id }}" \
            automatic:"${{ inputs.automatic_signing }}" \
            xcodeproj:"$GITHUB_WORKSPACE/${{ steps.detect.outputs.project }}"

      - name: Build ad-hoc IPA
        if: inputs.adhoc
        run: |
          if [ "${{ steps.detect.outputs.is_flutter }}" = "true" ]; then
            FLUTTER_ARGS=(build ipa --release --export-options-plist build/export-options/AdHoc.plist --build-number "${{ steps.version_meta.outputs.build_number }}")
            if [ -n "${{ steps.version_meta.outputs.marketing_version }}" ]; then
              FLUTTER_ARGS+=(--build-name "${{ steps.version_meta.outputs.marketing_version }}")
            fi
            if [ "${{ steps.detect.outputs.scheme }}" != "Runner" ]; then
              FLUTTER_ARGS+=(--flavor "${{ steps.detect.outputs.scheme }}")
            fi
            flutter "${FLUTTER_ARGS[@]}"
          else
            cd _ci
            bundle exec fastlane build_native \
              workspace:"$GITHUB_WORKSPACE/${{ steps.detect.outputs.workspace }}" \
              project:"$GITHUB_WORKSPACE/${{ steps.detect.outputs.project }}" \
              scheme:"${{ steps.detect.outputs.scheme }}" \
              configuration:"${{ steps.detect.outputs.configuration }}" \
              export_options:"$GITHUB_WORKSPACE/build/export-options/AdHoc.plist" \
              xcargs:"${{ steps.signing.outputs.xcargs }}"
          fi

      - name: Collect ad-hoc IPA
        if: inputs.adhoc
        run: |
          if [ "${{ steps.detect.outputs.is_flutter }}" = "true" ]; then
            cp build/ios/ipa/*.ipa build/artifacts/AdHoc.ipa
          else
            cp _ci/build/artifacts/App.ipa build/artifacts/AdHoc.ipa
          fi

      - name: Attach ad-hoc IPA to GitHub Release
        if: inputs.adhoc && github.event.release.tag_name
        uses: softprops/action-gh-release@v2
        with:
          files: build/artifacts/AdHoc.ipa

      - name: Upload to Diawi & notify Telegram
        if: inputs.adhoc
        continue-on-error: true
        env:
          DIAWI_TOKEN: ${{ secrets.DIAWI_TOKEN }}
          TG_WORKER_API_KEY: ${{ secrets.TG_WORKER_API_KEY }}
          TG_WORKER_URL: ${{ secrets.TG_WORKER_URL }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME:-manual-${GITHUB_RUN_NUMBER}}"
          fi

          RELEASE_NAME="${{ github.event.release.name }}"
          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="Manual ad-hoc build"
          fi

          RESPONSE=$(curl -s https://upload.diawi.com/ \
            -F token="$DIAWI_TOKEN" \
            -F file=@build/artifacts/AdHoc.ipa \
            -F find_by_udid=0 \
            -F wall_of_apps=0 \
            -F comment="$TAG")

          JOB_ID=$(echo "$RESPONSE" | jq -r '.job')
          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
            echo "ERROR: Diawi upload failed: $RESPONSE"
            exit 1
          fi
          echo "Diawi job: $JOB_ID"

          for i in $(seq 1 10); do
            sleep 3
            STATUS=$(curl -s "https://upload.diawi.com/status?token=$DIAWI_TOKEN&job=$JOB_ID")
            CODE=$(echo "$STATUS" | jq -r '.status')
            echo "Poll $i: status=$CODE"

            if [ "$CODE" = "2000" ]; then
              LINK=$(echo "$STATUS" | jq -r '.link')
              echo "Diawi link: $LINK"

              if [ -n "$TG_WORKER_API_KEY" ]; then
                REPO_NAME="${{ github.event.repository.name }}"
                MSG="${REPO_NAME} build available!\n\n${RELEASE_NAME}\nVersion: ${TAG}\n\nInstall: ${LINK}"
                curl -s -X POST \
                  "$TG_WORKER_URL" \
                  -H "Content-Type: application/json" \
                  -H "X-API-Key: $TG_WORKER_API_KEY" \
                  -d "{\"message\": \"$MSG\"}"
                echo ""
                echo "Telegram notification sent."
              fi
              exit 0
            elif [ "$CODE" != "2001" ]; then
              echo "ERROR: Diawi processing failed: $STATUS"
              exit 1
            fi
          done
          echo "ERROR: Diawi processing timed out after 30s"
          exit 1

      # ── Diagnostics ────────────────────────────

      # gym pipes xcodebuild through xcbeautify, which drops the detail that matters when
      # signing or provisioning fails — e.g. "Authentication failed" arrives with none of
      # Apple's actual response attached. The full raw output is tee'd to
      # ~/Library/Logs/gym/<Project>-<Scheme>.log on the runner and dies with it; stage a
      # copy as an artifact so a failed run can be diagnosed from the log instead of guessed
      # at. Contains no secrets: the auth flags in the command line are a file path and the
      # key/issuer IDs, which the workflow log already prints.
      - name: Stage raw xcodebuild logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/build-logs"
          cp -R "$HOME/Library/Logs/gym/." "$RUNNER_TEMP/build-logs/" 2>/dev/null \
            || echo ":: no gym logs found (failure happened before any xcodebuild run)"

          # xcodebuild's stdout carries a one-line summary of provisioning failures
          # ("Authentication failed: ...") with none of Apple's response attached — the
          # actual developer-services HTTP exchange goes to the macOS unified log. Pull the
          # last 30 minutes for the build processes, plus a pre-filtered slice of the
          # auth/provisioning lines so the interesting part is readable without paging
          # through the full dump.
          log show --last 30m --info --debug \
            --predicate 'process == "xcodebuild" OR process == "XCBBuildService"' \
            > "$RUNNER_TEMP/build-logs/unified-xcodebuild.log" 2>&1 \
            || echo ":: log show failed" > "$RUNNER_TEMP/build-logs/unified-xcodebuild.log"
          grep -iE "auth|token|provision|developerservices|bearer|401|403|denied" \
            "$RUNNER_TEMP/build-logs/unified-xcodebuild.log" \
            > "$RUNNER_TEMP/build-logs/unified-auth-slice.log" || true
          gzip -f "$RUNNER_TEMP/build-logs/unified-xcodebuild.log"
          echo ":: unified log staged ($(wc -l < "$RUNNER_TEMP/build-logs/unified-auth-slice.log" | tr -d ' ') auth-related lines)"

      - name: Upload raw xcodebuild logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: ${{ runner.temp }}/build-logs/
          if-no-files-found: ignore
          retention-days: 5

      # ── Cleanup ────────────────────────────────

      - name: Delete CI keychain
        if: always()
        run: security delete-keychain fastlane_ci.keychain || true

      - name: Remove API key
        if: always()
        # The glob also catches the AuthKey_<KEYID>.p8 copy the automatic-signing branch
        # makes for xcodebuild, and the canonical-search-path copy under
        # ~/.appstoreconnect/private_keys. Leaving a private key on a runner is not
        # acceptable even when the runner is ephemeral.
        run: |
          rm -f "$RUNNER_TEMP"/asc-secrets/AuthKey*.p8
          rm -f "$HOME"/.appstoreconnect/private_keys/AuthKey*.p8
