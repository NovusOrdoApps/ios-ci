# Reusable workflow: Push App Privacy / Data Usage disclosures
# (privacy nutrition labels) for one app, then optionally publish them.
#
# Reads the caller repo's metadata/AppPrivacy/data_usages.jsonc.
# Idempotent: re-running converges to the configured state.
#
# Required repo secrets:
#   APP_STORE_CONNECT_API_KEY_P8
#   APP_STORE_CONNECT_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID
#
# Required org secrets:
#   CHECKOUT_PAT
#
# Required repo variables:
#   IOS_RELEASE_APP_BUNDLE_ID

name: iOS Data Usages (Reusable)

on:
  workflow_call:
    inputs:
      input_path:
        description: "Path (relative to caller repo root) to data_usages.jsonc"
        required: false
        type: string
        default: "metadata/AppPrivacy/data_usages.jsonc"
      ruby_version:
        description: "Ruby version for fastlane"
        required: false
        type: string
        default: "3.2"
      macos_runner:
        description: "macOS runner label"
        required: false
        type: string
        default: "macos-26"

concurrency:
  group: ios-data-usages-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-data-usages:
    name: Update App Privacy Data Usages
    runs-on: ${{ inputs.macos_runner }}
    timeout-minutes: 15

    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_BUNDLE_ID: ${{ vars.IOS_RELEASE_APP_BUNDLE_ID }}

    steps:
      - name: Checkout app/metadata repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CHECKOUT_PAT || github.token }}

      - name: Checkout ios-ci tooling
        uses: actions/checkout@v4
        with:
          repository: NovusOrdoApps/ios-ci
          path: _ci

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true
          working-directory: _ci

      - name: Write API key
        run: |
          mkdir -p "$RUNNER_TEMP/secrets"
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}" > "$RUNNER_TEMP/secrets/AuthKey.p8"
          echo "ASC_KEY_P8_PATH=$RUNNER_TEMP/secrets/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Validate inputs
        run: |
          : "${APP_BUNDLE_ID:?Missing GitHub Actions variable IOS_RELEASE_APP_BUNDLE_ID}"

          if [ ! -f "${{ inputs.input_path }}" ]; then
            echo "ERROR: ${{ inputs.input_path }} not found at the caller repo root." >&2
            echo "See asc-ops-workflow/templates/app-repo/ for the schema." >&2
            exit 1
          fi

          echo ":: App Bundle ID: $APP_BUNDLE_ID"
          echo ":: Input path: ${{ inputs.input_path }}"

      - name: Push Data Usages to App Store Connect
        working-directory: _ci
        run: |
          bundle exec fastlane update_data_usages \
            input_path:"$GITHUB_WORKSPACE/${{ inputs.input_path }}"

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets/AuthKey.p8"
