# Reusable workflow: Push App Store server-to-server subscription
# notification URLs (production + sandbox) on one app.
#
# Reads the caller repo's metadata/AppInfo/subscription_status_url.jsonc.
# Idempotent — only PATCHes the fields that diverge from current state.
#
# Required repo secrets:
#   APP_STORE_CONNECT_API_KEY_P8
#   APP_STORE_CONNECT_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID
#
# Required org secrets:
#   CHECKOUT_PAT
#
# Required repo variables:
#   IOS_RELEASE_APP_BUNDLE_ID

name: iOS Subscription Status URL (Reusable)

on:
  workflow_call:
    inputs:
      input_path:
        description: "Path (relative to caller repo root) to subscription_status_url.jsonc"
        required: false
        type: string
        default: "metadata/AppInfo/subscription_status_url.jsonc"
      ruby_version:
        description: "Ruby version for fastlane"
        required: false
        type: string
        default: "3.2"
      macos_runner:
        description: "macOS runner label"
        required: false
        type: string
        default: "macos-26"

concurrency:
  group: ios-subscription-status-url-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-subscription-status-url:
    name: Update Subscription Status URLs
    runs-on: ${{ inputs.macos_runner }}
    timeout-minutes: 10

    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_BUNDLE_ID: ${{ vars.IOS_RELEASE_APP_BUNDLE_ID }}

    steps:
      - name: Checkout app/metadata repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CHECKOUT_PAT || github.token }}

      - name: Checkout ios-ci tooling
        uses: actions/checkout@v4
        with:
          repository: NovusOrdoApps/ios-ci
          path: _ci

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true
          working-directory: _ci

      - name: Write API key
        run: |
          mkdir -p "$RUNNER_TEMP/secrets"
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}" > "$RUNNER_TEMP/secrets/AuthKey.p8"
          echo "ASC_KEY_P8_PATH=$RUNNER_TEMP/secrets/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Validate inputs
        run: |
          : "${APP_BUNDLE_ID:?Missing GitHub Actions variable IOS_RELEASE_APP_BUNDLE_ID}"

          if [ ! -f "${{ inputs.input_path }}" ]; then
            echo ":: ${{ inputs.input_path }} not found — nothing to do (no subscription URLs configured)"
            echo "SKIP_RUN=1" >> "$GITHUB_ENV"
          fi

          echo ":: App Bundle ID: $APP_BUNDLE_ID"
          echo ":: Input path: ${{ inputs.input_path }}"

      - name: Push subscription status URLs to App Store Connect
        if: env.SKIP_RUN != '1'
        working-directory: _ci
        run: |
          bundle exec fastlane update_subscription_status_url \
            input_path:"$GITHUB_WORKSPACE/${{ inputs.input_path }}"

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets/AuthKey.p8"
