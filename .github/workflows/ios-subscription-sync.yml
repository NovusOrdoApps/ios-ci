# Reusable workflow: Pull auto-renewable subscription groups + their
# subscriptions from App Store Connect into a PR.
#
# Downloads groups (with localizations) + subscriptions (with localizations,
# pricing, availability, review screenshots), converts them into the repo
# source layout, and opens a PR if anything changed.
#
# Required repo secrets:
#   APP_STORE_CONNECT_API_KEY_P8
#   APP_STORE_CONNECT_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID
#
# Required org secrets:
#   CHECKOUT_PAT (optional; falls back to GITHUB_TOKEN if repo allows write)
#
# Required repo variables:
#   IOS_RELEASE_APP_BUNDLE_ID

name: iOS Subscription Sync (Reusable)

on:
  workflow_call:
    inputs:
      ruby_version:
        description: "Ruby version for fastlane"
        required: false
        type: string
        default: "3.2"
      macos_runner:
        description: "macOS runner label"
        required: false
        type: string
        default: "macos-26"

concurrency:
  group: ios-subscription-sync-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-subscriptions:
    name: Sync Subscriptions from App Store Connect
    runs-on: ${{ inputs.macos_runner }}
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write

    env:
      APP_BUNDLE_ID: ${{ vars.IOS_RELEASE_APP_BUNDLE_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CHECKOUT_PAT || github.token }}

      - name: Checkout ios-ci tooling
        uses: actions/checkout@v4
        with:
          repository: NovusOrdoApps/ios-ci
          path: _ci

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true
          working-directory: _ci

      - name: Resolve ASC credentials (Class 1 secrets ↔ Class 2 vault)
        uses: ./_ci/.github/actions/resolve-asc-credentials
        with:
          team_slug:          ${{ inputs.team_slug }}
          vault_pat:          ${{ secrets.VAULT_REPO_PAT }}
          fallback_p8:        ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          fallback_key_id:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          fallback_issuer_id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Validate inputs
        run: |
          : "${APP_BUNDLE_ID:?Missing GitHub Actions variable IOS_RELEASE_APP_BUNDLE_ID}"
          echo ":: App Bundle ID: $APP_BUNDLE_ID"

      - name: Fetch subscriptions from App Store Connect
        run: |
          rm -rf "$RUNNER_TEMP/sub-dump"
          (cd _ci && bundle exec fastlane fetch_subscription \
            output_path:"$RUNNER_TEMP/sub-dump")

      - name: Reverse-transform into source layout
        id: changes
        run: |
          if [ -d "metadata/Subscriptions" ]; then
            rm -rf metadata/Subscriptions
          fi
          mkdir -p metadata/Subscriptions

          ruby _ci/scripts/reverse_transform_subscription.rb \
            --input "$RUNNER_TEMP/sub-dump" \
            --output "$GITHUB_WORKSPACE/metadata/Subscriptions"

          if [ -n "$(git status --porcelain metadata/Subscriptions/)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git add metadata/Subscriptions/
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo ":: No changes — repo is already in sync."
          fi

      - name: Create PR
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.CHECKOUT_PAT || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="subscription-sync/$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "sync: pull subscriptions from App Store Connect"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "Sync auto-renewable subscriptions from App Store Connect" \
            --body "$(cat <<'BODY'
          ## Summary

          Pulled subscription groups + their subscriptions from App Store Connect
          and converted them into the repo source layout.

          - Per-group folders contain `group.jsonc` + `Text/` (localizations) +
            one folder per subscription named after its `product_id`
          - Per-subscription folders contain `subscription.jsonc` + optional
            `review_screenshot.png` + `Text/`
          - Localization fields shared across all locales are extracted into
            `Text/defaults/info.jsonc`; per-locale folders only keep overrides

          **Review the changes and merge when ready.**
          BODY
          )"

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-secrets/AuthKey.p8"
