# Reusable workflow: Create or update In-App Purchases on App Store Connect.
#
# Reads the caller repo's metadata/InAppPurchases/ source layout, validates it,
# and pushes consumable + non-consumable products to ASC. Idempotent: re-running
# is safe — products are matched by product_id, created if missing, updated if
# present.
#
# Required repo secrets:
#   APP_STORE_CONNECT_API_KEY_P8
#   APP_STORE_CONNECT_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID
#
# Required org secrets:
#   CHECKOUT_PAT
#
# Required repo variables:
#   IOS_RELEASE_APP_BUNDLE_ID

name: iOS IAP (Reusable)

on:
  workflow_call:
    inputs:
      ruby_version:
        description: "Ruby version for fastlane"
        required: false
        type: string
        default: "3.2"
      macos_runner:
        description: "macOS runner label"
        required: false
        type: string
        default: "macos-26"
      prune_orphans:
        description: "Delete IAPs on ASC that have no folder in metadata/InAppPurchases/. Only products that never reached review are eligible; approved or sold ones are refused. Off by default — orphans are reported either way."
        required: false
        type: boolean
        default: false

concurrency:
  group: ios-iap-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-iap:
    name: Update In-App Purchases
    runs-on: ${{ inputs.macos_runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout app/metadata repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CHECKOUT_PAT || github.token }}

      - name: Checkout ios-ci tooling
        uses: actions/checkout@v4
        with:
          repository: NovusOrdoApps/ios-ci
          path: _ci

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true
          working-directory: _ci

      - name: Resolve ASC credentials (Class 1 secrets ↔ Class 2 vault)
        uses: ./_ci/.github/actions/resolve-asc-credentials
        with:
          gh_token:           ${{ secrets.CHECKOUT_PAT || github.token }}
          team_slug:          ${{ inputs.team_slug }}
          vault_pat:          ${{ secrets.VAULT_REPO_PAT }}
          fallback_p8:        ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          fallback_key_id:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          fallback_issuer_id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}


      - name: Resolve app bundle ID (asc-app.jsonc → fallback to repo var)
        uses: ./_ci/.github/actions/resolve-app-bundle-id
        with:
          fallback: ${{ vars.IOS_RELEASE_APP_BUNDLE_ID }}
      - name: Validate inputs
        run: |
          : "${APP_BUNDLE_ID:?Missing GitHub Actions variable IOS_RELEASE_APP_BUNDLE_ID}"

          if [ ! -d "metadata/InAppPurchases" ]; then
            echo "ERROR: Expected metadata/InAppPurchases/ directory at the repo root." >&2
            echo "See ios-ci README for the expected IAP source layout." >&2
            exit 1
          fi

          echo ":: App Bundle ID: $APP_BUNDLE_ID"

      - name: Transform IAP source
        run: |
          ruby _ci/scripts/transform_iap.rb \
            --input "$GITHUB_WORKSPACE/metadata/InAppPurchases" \
            --output "$RUNNER_TEMP/iap-normalized.json"

      - name: Push IAPs to App Store Connect
        working-directory: _ci
        run: |
          bundle exec fastlane update_iap \
            input_path:"$RUNNER_TEMP/iap-normalized.json" \
            prune_orphans:"${{ inputs.prune_orphans }}"

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-secrets/AuthKey.p8"
